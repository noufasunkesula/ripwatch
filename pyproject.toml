[project]
name = "rw"
version = "0.1.0"
description = "RipWatch: rip current detection with an agent that decides and alerts lifeguards"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35",
    "pydantic>=2.7",
    # Range must stay compatible with the numpy COOL ships; constrained at install time on the worker.
    "numpy>=1.26,<3",
    "aws-embedded-metrics>=3.2",
    # mcp 2.x renamed FastMCP to MCPServer (Decision Log 2026-10-03).
    "mcp>=2.3,<3",
    "python-ulid>=3.0",
    # rw.bench prices.yaml, FakeLLM scripts and scripts/replay_cameras.yaml; needed on the worker too.
    "pyyaml>=6",
]

[project.optional-dependencies]
# Local, CI and std bench only. The worker uses COOL's cv2; never add opencv-python* to base.
cv-std = ["opencv-python-headless==5.0.0.93"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "moto[server]>=5.1",
    "ruff>=0.15",
    "pip-audit>=2.7",
    "huggingface_hub>=0.25",
    "pre-commit>=4",
    # zoneinfo data for scripts/now.py on Windows.
    "tzdata>=2024.1",
    # rw.bench charts (sprint-1.md N-14); the bench writes CSV and JSON without it.
    "matplotlib>=3.9",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rw"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Docs hold illustrative snippets, not code to format.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
markers = ["network: calls real external APIs; runs only with RW_RUN_NETWORK=1"]
